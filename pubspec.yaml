name: eros_n
description: An unofficial nhentai app.

publish_to: 'none'
version: 1.3.2+32

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  collection: ^1.19.1
  logger: ^2.8.0
  path_provider: ^2.1.6
  intl: ^0.20.3
  dynamic_system_colors: ^1.9.0
  http: ^1.6.0
  html: ^0.15.7
  # database: migrated from isar to objectbox
  objectbox: 6.0.0-preview.5
  objectbox_flutter_libs: 6.0.0-preview.5
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  cached_network_image:
    # ^4.0.5
    # Version ^4.0.5 not found in pub.dev repository
    git:
      url: https://github.com/Baseflow/flutter_cached_network_image.git
      ref: e0ca258
      path: cached_network_image
  font_awesome_flutter: ^11.0.0
  flutter_cache_manager: ^3.4.5
  octo_image: ^2.1.2
  dio_cache_interceptor: ^4.0.7
  http_cache_hive_store: ^5.1.1
  flutter_list_view: ^1.1.29
  waterfall_flow: ^3.1.1
  hooks_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.1
  flutter_smart_dialog: ^5.3.0
  sliver_tools: ^0.2.12
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  photo_view: ^0.15.0
  preload_page_view: ^0.2.0
  flutter_hooks: ^0.21.3+1
  url_launcher: ^6.3.3
  # replaced deprecated share with share_plus
  share_plus: ^13.3.1
  copy_with_extension: ^18.0.0
  path: ^1.9.1
  archive: ^4.5.2
  package_info_plus: ^10.2.2
  rotated_corner_decoration: ^2.1.0+1
  # replaced window_size (archived) + bitsdojo_window with window_manager
  window_manager: ^0.5.2
  # Unified WebView across Android/iOS/macOS/Windows/Linux/Web/OHOS.
  # Replaces inappwebview + webview_flutter + webview_flutter_windows:
  # inappwebview Windows backend (webview_windows) collided with
  # webview_flutter_windows on plugin class "WebviewWindowsPlugin".
  webview_all: ^1.4.7
  proxy_getter:
    # 本地副本：上游 1.2.0 已复刻到 plugins/proxy_getter，
    # 原因是为修复 Windows cargokit resolve_symlinks.ps1 对隐藏 AppData 路径的解析问题，
    # 详见 plugins/proxy_getter/LOCAL_PATCHES.md；上游修复后可恢复 pub.dev 依赖。
    path: plugins/proxy_getter
  scrollable_positioned_list: ^0.3.8
  gesture_zoom_box: ^0.0.4
  flutter_keyboard_visibility: ^7.0.1
  flutter_typeahead: ^6.0.0
  fluentui_system_icons: ^1.1.273
  palette_generator: ^0.3.3+7
  nil: ^1.1.1
  open_by_default:
    path: plugins/open_by_default
  flutter_android_volume_keydown:
    path: plugins/flutter_android_volume_keydown
  # replaced deprecated wakelock with wakelock_plus
  wakelock_plus: ^1.8.2
  uuid: ^4.6.0
  animations: ^3.0.0
  flutter_socks_proxy: ^0.0.3
  clock: ^1.1.3
  crypto: ^3.0.7
  liquid_glass_widgets: ^1.15.0
  meta: ^1.19.0
  dart_openai: ^8.0.0
  translator: ^1.0.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter pub run build_runner build --delete-conflicting-outputs
  # flutter pub run build_runner watch --delete-conflicting-outputs
  build_runner: ^2.16.1
  # Match the Riverpod 3.4.x / annotation 4.0.7 generated API.
  riverpod_generator: ^4.0.9
  json_serializable: ^6.15.2
  copy_with_extension_gen: ^18.0.0
  objectbox_generator: 6.0.0-preview.5
  # Lets tests build fake platform WebView controllers without pulling in a real platform backend.
  webview_platform_interface: ^1.4.7
  go_router_builder: ^4.5.2
  index_generator: ^4.1.2
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  nhentai: ^1.0.0-dev.9

flutter:
  uses-material-design: true
  # flutter gen-l10n (config in l10n.yaml, ARB sources in lib/l10n/)
  generate: true


# flutter pub run index_generator
index_generator:
  exclude:
    - '**.g.dart'
    - '**.freezed.dart'
  indexes:
    - path: lib/component/models
      name: index
    - path: lib/common/parser
      name: parser
